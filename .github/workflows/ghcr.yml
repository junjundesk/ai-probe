name: ghcr

# 构建本地中转镜像（amd64 + arm64）并推送到 GitHub Container Registry。
#
# ── 为什么单独一个文件，不去改 release.yml ────────────────────
# release.yml 打 v* tag 时编 Windows Nuitka 安装包并建 Release，那是桌面端
# 的产物；镜像里的中转服务是另一条运行路径（无 GUI）。拆开的好处是两边
# 可以各自触发：只改 Dockerfile 时手动跑这一条，不必连带重编 Windows 包。
#
# ── 触发方式 ─────────────────────────────────────────────────
#   · 推 main：产出 :latest 与 :sha-<短哈希>
#   · 推 v* tag：额外产出 :<版本号>（如 v1.1.4 → :1.1.4）
#   · 手动 workflow_dispatch：与推 main 相同
#
# ── 权限与 secrets ───────────────────────────────────────────
# packages: write 是推 GHCR 必需的；contents: read 只够检出源码。
# GHCR 用仓库自带的 GITHUB_TOKEN，不需要任何额外 secret。
#
# ── 缓存 ─────────────────────────────────────────────────────
# type=gha 把 BuildKit 缓存挂到 Actions cache：pip 依赖层首次装好后落缓存，
# 之后只改源码时直接命中，只剩 COPY 与 pip install 本地包两层重跑。
#
# ── 注意 ─────────────────────────────────────────────────────
#   · GHCR 新包默认私有。首次推送后若要免登录拉取，需到
#     https://github.com/users/junjundesk/packages/container/ai-probe/settings
#     把 visibility 改成 Public。
#   · 拉私有包要先登录：echo $GITHUB_TOKEN | docker login ghcr.io -u <用户名> --password-stdin

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  # github.repository 已是小写（junjundesk/ai-probe）—— GHCR 的镜像名
  # 强制小写，仓库名若含大写要先转换，这里不需要。
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 纯 Python 镜像，QEMU 只用于 arm64 下解包 wheel，开销很小。
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v4

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
