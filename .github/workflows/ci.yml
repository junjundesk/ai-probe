name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # PySide6 的 wheel 不带 Qt 依赖的系统库，缺了 libEGL 等会在导入
      # QtGui 时直接报 libEGL.so.1 找不到。offscreen 平台不需要显示服务，
      # 只补运行库即可让 Qt 界面测试真正跑起来。
      - name: 安装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen

  test-windows-ui:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt-package: "PySide6==6.7.0"
            scale: "1"
          - qt-package: "PySide6>=6.7,<7"
            scale: "1.5"
          - qt-package: "PySide6>=6.7,<7"
            scale: "2"
    env:
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "${{ matrix.qt-package }}"
      # Windows 原生插件与系统主题不在 Linux/offscreen 的覆盖范围内。
      # 先显式初始化 Qt，避免 GUI 依赖异常被测试的 skip 掩盖。
      - name: Verify native Qt runtime
        run: >
          python -c "import PySide6; from PySide6.QtWidgets import QApplication;
          app = QApplication([]); print('PySide6', PySide6.__version__, 'platform', app.platformName());
          print('screen', app.primaryScreen().availableGeometry(), 'DPR', app.primaryScreen().devicePixelRatio());
          assert app.platformName() == 'windows'"
      - run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, test-windows-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
