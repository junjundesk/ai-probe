name: Bug report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "感谢提交 Bug 报告，请尽量提供可复现信息。"
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本和安装方式
      placeholder: "Windows 11 / Python 3.12 / pip install -e ."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何复现问题
      placeholder: "1. 启动应用\n2. 添加项目\n3. 点击测活"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 粘贴错误输出或截图
    validations:
      required: true
