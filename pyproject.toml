[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-probe"
version = "1.0.0"
description = "Desktop AI API probe and local compatibility relay"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AI Probe Contributors" },
]
keywords = ["openai", "anthropic", "api", "probe", "relay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42,<51",
    "requests[socks]>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/junjundesk/ai-probe"
Repository = "https://github.com/junjundesk/ai-probe"
Issues = "https://github.com/junjundesk/ai-probe/issues"

[project.gui-scripts]
ai-probe = "ai_probe.entry:main"

[tool.setuptools.packages.find]
include = ["ai_probe*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
